name: Firestore rules tests

# Runs the Firestore security rules emulator tests (tests/rules/**) on
# GitHub's own runner — deliberately scoped to just this branch plus a
# manual trigger, not every push everywhere, since this was added to
# verify one specific feature (office accounts) without requiring
# anyone to install Java/Homebrew locally. Entirely local-emulator
# based (firebase emulators:exec --only firestore): no real Firebase
# project credentials are read or needed.
on:
  push:
    branches:
      - feature/office-accounts
  workflow_dispatch:

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:rules
